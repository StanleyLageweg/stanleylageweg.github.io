{% validate_fields include required="id" optional="title" %}

<iframe class="responsive-video" src="https://www.youtube.com/embed/{{ include.id }}" title="{{ include.title | default: 'YouTube video player' }}" width="560" height="315" frameborder="0" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
