{% if page.masthead or layout.masthead %}
<div class="masthead">
  <nav id="site-nav" aria-label="Primary navigation">
    <a class="site-title" href="{{ '/' | relative_url }}">
      {% responsive_image site.logo class="site-title__logo" %}
      <span class="site-title__title">{{ site.masthead_title | default: site.title | escape_once | strip }}</span>
      <span class="site-title__subtitle">{{ site.subtitle | escape_once | strip }}</span>
    </a>
  </nav>
</div>
{% endif %}
